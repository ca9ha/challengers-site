<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Каталог карт Challengers: поиск, наборы, типы и описания"><title>Challengers — каталог карт</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body><header><small>КАРТОТЕКА</small><h1>Challengers<span>!</span></h1><p>Карты, описания и вся коллекция в одном месте.</p></header><main><section class="filters" aria-label="Фильтры"><label>Поиск<input id="search" type="search" placeholder="Название, тип или текст эффекта"></label><label>Набор<select id="deck"><option value="">Все наборы</option><option>S</option><option>A</option><option>B</option><option>C</option></select></label><label>Тип / тематическая колода<select id="type"><option value="">Все типы</option></select></label><label>Сортировка<select id="sort"><option value="name">По названию</option><option value="deck">По набору S → A → B → C</option><option value="type">По типу</option><option value="power">По базовой силе</option></select></label><button id="reset">Сбросить</button></section><p id="status" role="status" aria-live="polite">Загрузка каталога…</p><section id="grid" class="grid" aria-label="Карты"></section><footer>Неофициальный каталог Challengers. Права на изображения принадлежат их правообладателям.</footer></main><dialog id="modal" aria-labelledby="title"><button id="close" class="close" aria-label="Закрыть">Закрыть ✕</button><div class="detail"><img id="picture" alt=""><div><h2 id="title"></h2><p id="meta"></p><h3>Описание</h3><p id="description" class="description"></p></div></div></dialog></body></html>
