<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пляжный сезон — тир-лист</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111421;color:#f5f5ff;font:16px system-ui,sans-serif}header,main{max-width:1550px;padding:24px;margin:auto}a{color:#bdacff}h1{font-size:clamp(28px,5vw,46px);margin:20px 0 8px}p{color:#b7c1d9;line-height:1.6}.tools{display:flex;flex-wrap:wrap;gap:16px;align-items:end;margin:20px 0}label{display:flex;flex-direction:column;gap:8px;color:#b7c1d9;font-size:14px}label:first-child{flex:1;min-width:210px}input,select,button{font:inherit;border:1px solid #454d69;border-radius:9px;padding:10px 12px;background:#1c2235;color:#fff}button,select{cursor:pointer}.check{flex-direction:row;align-items:center;padding:10px 0}input[type=checkbox]{accent-color:#baabff}:focus-visible{outline:3px solid #baabff;outline-offset:3px}.board{border:1px solid #42495e;border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:95px minmax(0,1fr);border-bottom:1px solid #42495e;min-height:110px}.row:last-child{border-bottom:0}.tier{margin:0;padding:14px 5px;color:#19202d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:30px}.tier small{font-size:12px;text-align:center}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:12px;background:#191d29;align-content:start}.card{padding:0;max-width:180px;min-width:0;border-radius:8px;overflow:hidden;text-align:left}.art{aspect-ratio:315/460;display:flex;align-items:center;justify-content:center;background:#0c0f18}.art img{width:100%;height:100%;object-fit:contain}.name{display:block;font-size:12px;padding:8px;line-height:1.4}.missing{font-size:11px;padding:8px;overflow-wrap:anywhere}.empty{grid-column:1/-1;color:#aeb8cd;padding:14px}.compact .name{display:none}.compact .cards{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}.error{color:#ffb9c5}.source{font-size:13px}dialog{background:#1c2235;color:#fff;border:1px solid #454d69;border-radius:15px;width:calc(100% - 24px);max-width:850px;max-height:94vh;padding:20px}dialog::backdrop{background:#000b}.close{display:block;margin:0 0 15px auto}.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.detail img{width:100%;max-height:75vh;object-fit:contain}.description{white-space:pre-wrap}footer{font-size:12px;color:#aeb8cd;margin-top:25px}@media(max-width:600px){header,main{padding:15px}.row{grid-template-columns:55px minmax(0,1fr)}.cards{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:7px;padding:7px}.tier{font-size:24px}.tier small{font-size:10px}.detail{grid-template-columns:1fr}.detail img{max-height:50vh}.tools label{width:100%}}
</style></head><body><header><a href="index.html">← В каталог</a><h1>Пляжный сезон — Tier List</h1><p>S — лучшие, D — плохие. Набор карты и её рейтинг — разные поля.</p><div class="tools"><label>Поиск<input id="search" type="search" placeholder="Название, тип или эффект"></label><label>Тематическая колода<select id="type"><option value="">Все типы</option></select></label><label class="check"><input type="checkbox" id="personal" checked>Личные оценки браузера</label><label class="check"><input type="checkbox" id="compact">Компактный вид</label></div><p id="source" class="source"></p></header><main><p id="status" role="status" aria-live="polite">Загрузка тир-листа…</p><div id="board" class="board"></div><footer>Нажмите на карту для увеличения. Данные: data/cards.csv, только box=beach. Неофициальный каталог.</footer></main><dialog id="modal" aria-labelledby="title"><button id="close" class="close">Закрыть</button><div class="detail"><img id="picture" alt=""><div><h2 id="title"></h2><p id="meta"></p><p id="description" class="description"></p></div></div></dialog>
<script>
window.addEventListener('error',function(event){var status=document.getElementById('status');if(status){status.className='error';status.textContent='Ошибка JavaScript: '+event.message;}});
</script>
<script>
'use strict';
(function(){
 const $=id=>document.getElementById(id);
 const tiers=['S','A','B','C','D',''];
 const labels=['Лучшие','Отличные','Хорошие','Слабые','Плохие','Без оценки'];
 const colors=['#ff898d','#ffc487','#ffe28a','#dcf49c','#99dfc7','#b2b9cd'];
 const storageKey='challengers-personal-ratings-v1';
 let cards=[],personal={},storageOK=true;
 function own(o,k){return Object.prototype.hasOwnProperty.call(o,k);}
 function make(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
 function error(message){$('status').className='error';$('status').textContent='Ошибка: '+message;}
 function readPersonal(){personal={};storageOK=true;try{const data=JSON.parse(localStorage.getItem(storageKey)||'{}');if(data&&typeof data==='object'&&!Array.isArray(data)){for(const [k,v] of Object.entries(data)){if(tiers.includes(v))personal[k]=v;}}}catch(e){storageOK=false;}}
 function getRating(card){const k=JSON.stringify([card.box,card.id]);return $('personal').checked&&own(personal,k)?personal[k]:card.rating;}
 function parseCSV(source){
  const text=source.replace(/^\uFEFF/,'');
  const header=text.split(/\r\n|\n|\r/,1)[0];
  const separator=header.includes(';')&&!header.includes(',')?';':',';
  const rows=[];let row=[],field='',quoted=false,closed=false;
  function endField(){row.push(field);field='';closed=false;}
  function endRow(){endField();if(row.some(v=>v.trim()!==''))rows.push(row);row=[];}
  for(let i=0;i<text.length;i++){
   const char=text[i];
   if(quoted){if(char==='"'){if(text[i+1]==='"'){field+='"';i++;}else{quoted=false;closed=true;}}else field+=char;continue;}
   if(char===separator){endField();continue;}
   if(char==='\r'||char==='\n'){if(char==='\r'&&text[i+1]==='\n')i++;endRow();continue;}
   if(closed){if(char===' '||char==='\t')continue;throw Error('Лишние символы после кавычки в CSV.');}
   if(char==='"'){if(field!=='')throw Error('Некорректные кавычки в CSV.');quoted=true;}else field+=char;
  }
  if(quoted)throw Error('В CSV не закрыты кавычки.');
  if(field!==''||row.length||closed)endRow();
  if(!rows.length)throw Error('CSV пуст.');
  const headers=rows.shift().map(v=>v.trim());
  if(new Set(headers).size!==headers.length)throw Error('Повторяются заголовки CSV.');
  for(const key of ['id','name','type','image','box','rating'])if(!headers.includes(key))throw Error('В CSV отсутствует столбец '+key+'. Нужен общий CSV с рейтингами.');
  const ids=new Set();
  return rows.map((values,index)=>{
   if(values.length!==headers.length)throw Error('Запись '+(index+2)+': неверное число столбцов.');
   return Object.fromEntries(headers.map((key,i)=>[key,values[i].trim()]));
  }).filter(card=>card.box==='beach').map(card=>{
   if(!card.id||!card.name||!card.type||!card.image)throw Error('Заполните id, name, type, image у второй коробки.');
   if(ids.has(card.id))throw Error('Повторяется id: '+card.id);ids.add(card.id);
   card.rating=card.rating.toUpperCase();if(!tiers.includes(card.rating))throw Error('Неизвестный рейтинг у карты '+card.name);
   const path=card.image.replace(/\\/g,'/');const parts=path.split('/');
   if(!path.startsWith('images/')||parts.some(part=>!part||part==='.'||part==='..')||/[?#]/.test(path))throw Error('Неверный путь изображения: '+card.image);
   card.imageURL=parts.map(encodeURIComponent).join('/');return card;
  });
 }
 function openCard(card){$('title').textContent=card.name;$('meta').textContent=['Коробка 2',card.type,'Рейтинг: '+(getRating(card)||'—'),'Набор: '+(card.deck||'—'),'Сила: '+(card.power||'—')].join(' · ');$('description').textContent=card.description||'Описание пока не добавлено.';const image=$('picture');image.onerror=()=>{image.onerror=null;image.removeAttribute('src');image.alt='Не найдено: '+card.image;};image.alt=card.name;image.src=card.imageURL;$('modal').showModal();}
 function render(){
  const query=$('search').value.trim().toLocaleLowerCase('ru');const type=$('type').value;
  const list=cards.filter(card=>(!type||card.type===type)&&(!query||[card.name,card.type,card.description||''].join(' ').toLocaleLowerCase('ru').includes(query))).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  $('status').className='';$('status').textContent='Показано '+list.length+' из '+cards.length+' записей второй коробки.';
  $('source').textContent=$('personal').checked?(storageOK?'Источник: CSV + личные оценки браузера.':'Источник: CSV; личное хранилище недоступно.'):'Источник: только rating из CSV.';
  const rows=tiers.map((tier,index)=>{
   const matching=list.filter(card=>getRating(card)===tier);const row=make('section','row');row.setAttribute('aria-label',(tier||'Без оценки')+': '+matching.length);
   const label=make('h2','tier');label.style.background=colors[index];label.append(document.createTextNode(tier||'—'),make('small','',labels[index]),make('small','',String(matching.length)));
   const area=make('div','cards');
   for(const card of matching){const button=make('button','card');button.type='button';button.title=card.name+' · '+card.type;button.setAttribute('aria-label','Открыть карту '+card.name);const art=make('div','art'),image=make('img');image.loading='lazy';image.alt=card.name;image.onerror=()=>image.replaceWith(make('span','missing','Не найдено: '+card.image));image.src=card.imageURL;art.append(image);button.append(art,make('span','name',card.name));button.onclick=()=>openCard(card);area.append(button);}
   if(!matching.length)area.append(make('p','empty','Нет карт'));row.append(label,area);return row;
  });
  $('board').replaceChildren(...rows);
 }
 $('search').oninput=render;$('type').onchange=render;$('personal').onchange=render;$('compact').onchange=()=>document.body.classList.toggle('compact',$('compact').checked);
 $('close').onclick=()=>$('modal').close();$('modal').onclick=event=>{if(event.target!==$('modal'))return;const bounds=$('modal').getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)$('modal').close();};
 window.addEventListener('storage',event=>{if(event.key===null||event.key===storageKey){readPersonal();render();}});
 window.addEventListener('focus',()=>{if(cards.length){readPersonal();render();}});
 async function init(){
  if(location.protocol==='file:'){error('Страница открыта как файл. Запустите HTTP-сервер и откройте http://127.0.0.1:8000/tier-list.html');return;}
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
  try{
   $('status').textContent='Загрузка data/cards.csv…';
   const response=await fetch('data/cards.csv',{cache:'no-cache',signal:controller.signal});
   if(!response.ok)throw Error('Не удалось загрузить data/cards.csv: HTTP '+response.status);
   const text=await response.text();
   if(/^\s*(<!doctype html|<html[\s>])/i.test(text))throw Error('Вместо CSV получен HTML. Проверьте путь data/cards.csv.');
   cards=parseCSV(text);readPersonal();
   const types=[...new Set(cards.map(card=>card.type))].sort((a,b)=>a.localeCompare(b,'ru'));
   $('type').replaceChildren(new Option('Все типы',''),...types.map(type=>new Option(type,type)));
   render();if(!cards.length)$('status').textContent='В CSV нет карт box=beach.';
  }catch(e){console.error(e);error(e.name==='AbortError'?'CSV не загрузился за 15 секунд.':e.message);}finally{clearTimeout(timeout);}
 }
 init();
})();
</script></body></html>
